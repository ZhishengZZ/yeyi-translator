name: Deploy promo-v4 to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "promo-v4/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload promo-v4
        uses: actions/upload-pages-artifact@v4
        with:
          path: promo-v4

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
